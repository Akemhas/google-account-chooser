<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Account Chooser Redirect</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="popup-header">
    <img class="popup-mark" src="icons/icon32.png" alt="" width="20" height="20">
    <h1 class="popup-title">Account Chooser</h1>
    <label class="switch" aria-label="Enable extension">
        <input type="checkbox" id="enabled" checked>
        <span class="switch-track"></span>
    </label>
</header>

<main id="gated-content" class="popup-content">
    <section class="card" id="context-card" aria-label="Current page">
        <div class="context-row">
            <div class="context-text">
                <div class="card-title" id="contextHostname">–</div>
                <span class="chip" id="contextStatus">No page context</span>
            </div>
            <button class="btn btn-secondary" id="contextExcludeBtn" hidden>Exclude this site</button>
        </div>
    </section>

    <section class="card" id="suggestion-card" aria-label="Suggestion from recent chooser">
        <div class="card-title">Suggestion From Recent Chooser</div>
        <div class="card-copy" id="suggestedRuleHint">No recent chooser-based suggestion for this tab yet.</div>
        <div class="card-actions">
            <button class="btn btn-primary" id="useSuggestedRuleBtn" type="button" disabled>Save Suggested Rule</button>
        </div>
    </section>

    <section class="card" aria-label="Redirect behavior">
        <div class="card-title">Redirect Behavior</div>
        <div class="toggle-list">
            <label class="toggle-row">
                <span class="toggle-copy">Skip chooser when URL already picks an account</span>
                <span class="switch">
                    <input type="checkbox" id="skipIfAccountSpecified" checked>
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Intercept clicks on non-Google sites</span>
                <span class="switch">
                    <input type="checkbox" id="interceptExternalClicks" checked>
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Intercept typed and bookmarked Google URLs</span>
                <span class="switch">
                    <input type="checkbox" id="interceptDirectNavigation">
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Intercept navigation between Google apps</span>
                <span class="switch">
                    <input type="checkbox" id="interceptGoogleNavigation">
                    <span class="switch-track"></span>
                </span>
            </label>
        </div>
    </section>
</main>

<footer class="popup-footer">
    <span class="footer-version" id="versionLabel"></span>
    <button class="btn btn-ghost" id="openOptionsBtn">Manage rules &amp; sites</button>
</footer>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
