<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Google Account Chooser Redirect</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="popup-header">
    <img class="popup-mark" src="icons/icon32.png" alt="" width="20" height="20">
    <h1 class="popup-title">Account Chooser</h1>
    <label class="switch" aria-label="Enable extension">
        <input type="checkbox" id="enabled" checked>
        <span class="switch-track"></span>
    </label>
</header>

<main id="gated-content" class="popup-content">
    <nav class="popup-tabs" role="tablist" aria-label="Popup sections">
        <button class="popup-tab" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="true" data-panel="overview">Overview</button>
        <button class="popup-tab" role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" data-panel="history" tabindex="-1">History<span class="tab-count" id="historyTabCount" hidden></span></button>
    </nav>

    <section class="popup-panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
    <section class="card" id="context-card" aria-label="Current page">
        <div class="context-row">
            <div class="context-text">
                <div class="card-title" id="contextHostname">–</div>
                <span class="chip" id="contextStatus">No page context</span>
            </div>
            <button class="btn btn-secondary" id="contextExcludeBtn" hidden>Exclude this site</button>
        </div>
    </section>

    <section class="card" id="suggestion-card" aria-label="Suggestion from recent chooser">
        <div class="card-title">Suggestion From Recent Chooser</div>
        <div class="card-copy" id="suggestedRuleHint">No recent chooser-based suggestion for this tab yet.</div>
        <div class="card-actions">
            <button class="btn btn-primary" id="useSuggestedRuleBtn" type="button" disabled>Save Suggested Rule</button>
        </div>
    </section>

    <section class="card" aria-label="Redirect behavior">
        <div class="card-title">Redirect Behavior</div>
        <div class="toggle-list">
            <label class="toggle-row">
                <span class="toggle-copy">Trust the account already in the link</span>
                <span class="switch">
                    <input type="checkbox" id="skipIfAccountSpecified" checked>
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Intercept clicks on non-Google sites</span>
                <span class="switch">
                    <input type="checkbox" id="interceptExternalClicks" checked>
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Intercept typed and bookmarked Google URLs</span>
                <span class="switch">
                    <input type="checkbox" id="interceptDirectNavigation">
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row toggle-row-sub">
                <span class="toggle-copy">Redirect before the request is sent <span class="toggle-tag">Experimental</span></span>
                <span class="switch">
                    <input type="checkbox" id="dnrInterception">
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Intercept navigation between Google apps</span>
                <span class="switch">
                    <input type="checkbox" id="interceptGoogleNavigation">
                    <span class="switch-track"></span>
                </span>
            </label>
            <label class="toggle-row">
                <span class="toggle-copy">Save document rules without asking</span>
                <span class="switch">
                    <input type="checkbox" id="autoSaveSuggestedRules">
                    <span class="switch-track"></span>
                </span>
            </label>
        </div>
    </section>
    </section>

    <section class="popup-panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
        <div class="panel-head">
            <div class="panel-head-text">
                <h2 class="panel-title">Trusted Links</h2>
                <p class="card-copy">Saved links open with their account automatically. Grouped by service — pause, edit, or remove any of them here.</p>
            </div>
            <button class="btn btn-danger-ghost" id="clearHistoryBtn" hidden>Remove all</button>
        </div>
        <div class="history-list" id="historyList"></div>
    </section>
</main>

<footer class="popup-footer">
    <span class="footer-version" id="versionLabel"></span>
    <div class="footer-actions">
        <button class="icon-btn" id="themeToggleBtn" type="button" aria-label="Switch color theme"></button>
        <button class="btn btn-ghost" id="openOptionsBtn">Manage rules &amp; sites</button>
    </div>
</footer>

<script src="config.js"></script>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
